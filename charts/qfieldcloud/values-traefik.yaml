# Values for QFieldCloud deployment with Traefik
# Deploy with: helm install qfieldcloud . -f values-traefik.yaml -n qfieldcloud --create-namespace

# Global configuration
global:
  domain: "qfieldcloud.example.com"

# Use ARM64-compatible images from Docker Hub
image:
  repository: opengisch/qfieldcloud-app
  tag: latest
  pullPolicy: IfNotPresent

# Nginx configuration for serving static files
nginx:
  image:
    repository: opengisch/qfieldcloud-nginx
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# QGIS configuration
qgis:
  image:
    repository: opengisch/qfieldcloud-qgis
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

# Worker configuration
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: opengisch/qfieldcloud-worker-wrapper
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Cron jobs configuration
cronJobs:
  enabled: true
  image:
    repository: opengisch/qfieldcloud-app
    tag: latest
    pullPolicy: Always

# Traefik Ingress configuration
ingress:
  enabled: true
  className: "traefik"
  annotations:
    # Traefik-specific annotations
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  # hosts and tls are dynamically generated from global.domain in the template

# Service configuration
service:
  type: ClusterIP
  port: 80

# Django configuration for production
django:
  settings:
    debug: 1 # Enable debug temporarily to bypass nginx proxy check
    environment: production
    settingsModule: "qfieldcloud.settings"
    accountEmailVerification: "none"
    useI18n: 1
    defaultLanguage: "en"
    defaultTimeZone: "UTC"
    authTokenExpirationHours: 24
    passwordLoginDisabled: false
    subscriptionModel: "subscription.Subscription"
    # workerQfieldcloudUrl is auto-generated by template: http://qfieldcloud:80/api/v1/
    # This ensures workers communicate internally without SSL issues
    # Kubernetes worker backend configuration
    workerBackend: "kubernetes"
    k8sNamespace: "qfieldcloud"
    k8sServiceAccount: "qfieldcloud"
    k8sDebug: false # Enable verbose K8s API debugging
    # Secret key - CHANGE THIS IN PRODUCTION
    secretKey: "example-secret-key-change-me-in-production"
    # Salt key for encrypted fields - CHANGE THIS IN PRODUCTION
    saltKey: "example-salt-key-change-me"
  gunicorn:
    timeout: 120
    maxRequests: 1000
    workers: 4
    threads: 2
  sentry:
    # Sentry DSN (optional - empty for now)
    dsn: ""
    release: ""
    sampleRate: 0.1
  email:
    host: "127.0.0.1" # Localhost - no external email sending
    useTls: false
    useSsl: false
    port: 25
    hostUser: "" # No authentication needed for localhost
    hostPassword: "" # No password needed for localhost
    defaultFromEmail: "noreply@example.com"
  # Storage configuration - configure for your S3-compatible storage
  storage:
    type: "s3"
    # Storage credentials are managed via secrets template - set these in production
    accessKeyId: "example-access-key"
    secretAccessKey: "example-secret-access-key-change-me"
    bucketName: "qfieldcloud"
    regionName: null
    endpointUrl: "http://minio.qfieldcloud.svc.cluster.local:9000" # Use internal MinIO service
    projectDefaultStorage: "default"
    minioApiPort: 9000
    minioBrowserPort: 9001
    # storagesConfig is dynamically generated by template to include secret references

# Database configuration - using actual PostgreSQL cluster settings
database:
  external: true
  host: "qfieldcloud-postgres-rw.qfieldcloud.svc.cluster.local" # Use internal PostgreSQL service
  port: 5432
  name: "app" # Database name
  user: "app" # Database user
  password: "change-me-database-password" # CHANGE THIS IN PRODUCTION
  sslMode: "prefer"

# PostgreSQL Cluster configuration with PostGIS through private registry
postgresql:
  enabled: true
  image:
    repository: "ghcr.io/cloudnative-pg/postgis"
    tag: "16-3"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgis:16-3"

# Geodatabase configuration - needs to be created in the same database
geodatabase:
  external: true
  host: "qfieldcloud-postgres-rw.qfieldcloud.svc.cluster.local" # Use internal PostgreSQL service
  port: 5432
  name: "app" # Same database, different schema/tables
  user: "app" # Same user
  password: "change-me-geodatabase-password" # CHANGE THIS IN PRODUCTION

# Resource limits suitable for production
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Persistence
persistence:
  transformationGrids:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce
    storageClass: "" # Use default storage class

# Static files configuration
staticFiles:
  mountPath: "/usr/src/app/staticfiles"
  storage:
    size: "2Gi"
    storageClass: "nfs-client"
